<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentine Media Manager</title>
    <style>
      :root { --bg:#fff6fb; --card:#fff; --primary:#e84393; --primary-dark:#c92f78; --text:#2d1438; --muted:#7b6786; --border:#f3d9e8; --danger:#dc3545; --danger-dark:#b52331; --ring:rgba(232,67,147,.25); --shadow:0 15px 35px rgba(96,34,83,.1); --ok:#218838; --error:#b4232e; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif; background:radial-gradient(circle at top right,#ffd8ec,transparent 45%),var(--bg); color:var(--text); padding:2rem 1rem 3rem; }
      .container { max-width:1080px; margin:0 auto; display:grid; gap:1.25rem; }
      .panel { background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); padding:1.25rem; }
      h1 { margin:0; font-size:clamp(1.5rem,2vw + 1rem,2.4rem); }
      .subtitle { margin:.35rem 0 0; color:var(--muted); }
      .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.9rem; margin-top:.9rem; }
      .field { display:flex; flex-direction:column; gap:.35rem; }
      label { font-weight:600; font-size:.95rem; }
      input,textarea,select { width:100%; border:1px solid var(--border); border-radius:12px; padding:.68rem .8rem; font:inherit; color:inherit; background:#fff; }
      textarea { resize:vertical; min-height:96px; }
      input:focus,textarea:focus,select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 4px var(--ring); }
      .actions { display:flex; flex-wrap:wrap; gap:.7rem; margin-top:.95rem; }
      button { border:none; border-radius:999px; padding:.68rem 1.1rem; font-weight:700; font-size:.95rem; cursor:pointer; }
      .btn-primary { background:var(--primary); color:#fff; } .btn-primary:hover { background:var(--primary-dark); }
      .btn-secondary { background:#f6eef3; color:var(--text); }
      .btn-danger { background:var(--danger); color:#fff; } .btn-danger:hover { background:var(--danger-dark); }
      .info-row { display:flex; justify-content:space-between; gap:.8rem; align-items:center; flex-wrap:wrap; margin-bottom:.7rem; }
      .badge { font-size:.85rem; background:#ffe5f1; color:#8a2f62; padding:.3rem .62rem; border-radius:999px; font-weight:600; }
      #mediaList { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:1rem; margin-top:.9rem; }
      .media-card { border:1px solid var(--border); border-radius:14px; overflow:hidden; background:#fff; display:flex; flex-direction:column; }
      .preview { height:170px; background:#f9f2f7; display:grid; place-items:center; }
      .preview img,.preview video { width:100%; height:100%; object-fit:cover; }
      .card-body { padding:.85rem; display:flex; flex-direction:column; gap:.42rem; background-color:#ffffff66; backdrop-filter:blur(10px); }
      .meta { margin:0; color:var(--muted); font-size:.86rem; word-break:break-word; }
      .card-actions { display:flex; gap:.55rem; margin-top:.35rem; }
      .card-actions button { flex:1; border-radius:10px; padding:.58rem .65rem; font-size:.85rem; }
      .empty { border:1px dashed var(--border); border-radius:14px; padding:1.5rem; text-align:center; color:var(--muted); background:#fff; }
      .notice { margin-top:.6rem; color:var(--muted); font-size:.84rem; line-height:1.35; }
      .status { margin-top:.6rem; font-size:.88rem; font-weight:600; }
      .status.ok { color:var(--ok); } .status.error { color:var(--error); }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="panel">
        <h1>Valentine Media CRUD Form</h1>
        <p class="subtitle">Manage slideshow entries from <code>slideshow.json</code> and media files in <code>assets/</code>.</p>
        <form id="mediaForm" novalidate>
          <input id="mediaId" type="hidden" />
          <div class="form-grid">
            <div class="field"><label for="title">Title</label><input id="title" type="text" placeholder="My lovely memory" /></div>
            <div class="field"><label for="mediaType">Media Type</label><select id="mediaType" required><option value="">Select type</option><option value="image">Image</option><option value="video">Video</option></select></div>
            <div class="field"><label for="sortOrder">Slide Sort Order</label><input id="sortOrder" type="number" min="1" step="1" placeholder="1" /></div>
            <div class="field" style="grid-column:1 / -1"><label for="srcPath">Repo file path</label><input id="srcPath" type="text" placeholder="assets/new-photo.jpg" /></div>
            <div class="field" style="grid-column:1 / -1"><label for="description">Description</label><textarea id="description" placeholder="Write a short description..."></textarea></div>
            <div class="field" style="grid-column:1 / -1"><label for="fileInput">Choose file (uses name to auto-fill repo path)</label><input id="fileInput" type="file" multiple accept="image/*,video/*" /></div>
          </div>
          <p class="notice" style="margin-bottom:0">Selected files are referenced as <code>assets/&lt;filename&gt;</code>. Copy files into the repo <code>assets/</code> folder before deploying.</p>
          <div class="actions">
            <button type="submit" class="btn-primary" id="submitButton">Create Media</button>
            <button type="button" class="btn-secondary" id="resetButton">Reset</button>
            <button type="button" class="btn-secondary" id="downloadButton">Download updated slideshow.json</button>
          </div>
        </form>
        <p class="status" id="statusMessage">Loading local slideshow.json...</p>
      </section>
      <section class="panel">
        <div class="info-row"><h2 style="margin:0;font-size:1.15rem">Media Library</h2><span class="badge" id="countBadge">0 items</span></div>
        <div id="mediaList"></div>
      </section>
    </main>

    <script>
      const form = document.getElementById('mediaForm');
      const mediaIdInput = document.getElementById('mediaId');
      const titleInput = document.getElementById('title');
      const typeInput = document.getElementById('mediaType');
      const sortOrderInput = document.getElementById('sortOrder');
      const srcPathInput = document.getElementById('srcPath');
      const descriptionInput = document.getElementById('description');
      const fileInput = document.getElementById('fileInput');
      const submitButton = document.getElementById('submitButton');
      const resetButton = document.getElementById('resetButton');
      const downloadButton = document.getElementById('downloadButton');
      const mediaList = document.getElementById('mediaList');
      const countBadge = document.getElementById('countBadge');
      const statusMessage = document.getElementById('statusMessage');

      let mediaItems = [];

      const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const setStatus = (m, t = 'ok') => { statusMessage.textContent = m; statusMessage.className = `status ${t}`; };
      const detectType = (name = '') => /\.(mp4|webm|ogg|mov)$/i.test(name) ? 'video' : 'image';
      const esc = (v = '') => v.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');

      function normalizeRecord(item, index) {
        return {
          id: item.id || uid(),
          title: item.title || `Media ${index + 1}`,
          description: item.description || '',
          type: item.type || detectType(item.src),
          src: item.src || '',
          sortOrder: Number(item.sortOrder) > 0 ? Number(item.sortOrder) : index + 1,
          source: 'repo-assets'
        };
      }

      async function loadFromRepo() {
        try {
          const res = await fetch('./slideshow.json', { cache: 'no-store' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const assets = data?.valentine?.slideshow?.assets || [];
          mediaItems = assets.map((item, i) => normalizeRecord(item, i)).sort((a,b) => a.sortOrder - b.sortOrder);
          renderList();
          setStatus('Loaded slideshow.json from this repo.', 'ok');
        } catch (error) {
          setStatus(`Unable to read slideshow.json: ${error.message}`, 'error');
        }
      }

      function renderList() {
        countBadge.textContent = `${mediaItems.length} item${mediaItems.length === 1 ? '' : 's'}`;
        if (!mediaItems.length) {
          mediaList.innerHTML = '<div class="empty">No media entries yet.</div>';
          return;
        }

        mediaList.innerHTML = mediaItems.map((item) => {
          const preview = item.type === 'video'
            ? `<video src="${esc(item.src)}" controls muted></video>`
            : `<img src="${esc(item.src)}" alt="${esc(item.title)}">`;
          return `<article class="media-card"><div class="preview">${preview}</div><div class="card-body"><strong>${esc(item.title)}</strong><p class="meta">${esc(item.description || 'No description')}</p><p class="meta">Type: ${item.type} • Source: ${item.source}</p><p class="meta">Path: ${esc(item.src)} • Order: ${item.sortOrder}</p><div class="card-actions"><button class="btn-secondary" data-action="edit" data-id="${item.id}">Edit</button><button class="btn-danger" data-action="delete" data-id="${item.id}">Delete</button></div></div></article>`;
        }).join('');
      }

      function resetForm() {
        form.reset();
        mediaIdInput.value = '';
        submitButton.textContent = 'Create Media';
      }

      function buildJson() {
        const sorted = [...mediaItems].sort((a,b) => a.sortOrder - b.sortOrder);
        return {
          valentine: {
            slideshow: {
              intervalMs: 5000,
              assets: sorted.map(({ title, description, type, src, sortOrder }) => ({ title, description, type, src, sortOrder }))
            }
          }
        };
      }

      function handleSubmit(event) {
        event.preventDefault();
        const editingId = mediaIdInput.value;
        const selected = [...fileInput.files];
        const parsedOrder = Number(sortOrderInput.value) || (mediaItems.length + 1);

        const toCreate = selected.length ? selected.map((file, i) => ({
          id: uid(),
          title: titleInput.value.trim() || file.name,
          description: descriptionInput.value.trim(),
          type: typeInput.value || detectType(file.name),
          src: `assets/${file.name}`,
          sortOrder: parsedOrder + i,
          source: 'repo-assets'
        })) : [{
          id: editingId || uid(),
          title: titleInput.value.trim() || 'Untitled',
          description: descriptionInput.value.trim(),
          type: typeInput.value || detectType(srcPathInput.value.trim()),
          src: srcPathInput.value.trim(),
          sortOrder: parsedOrder,
          source: 'repo-assets'
        }];

        if (!toCreate[0].src) {
          setStatus('Add a repo path (ex: assets/1.jpg) or choose a file.', 'error');
          return;
        }

        if (editingId) {
          mediaItems = mediaItems.map((item) => item.id === editingId ? { ...toCreate[0], id: editingId } : item);
          setStatus('Media entry updated locally.', 'ok');
        } else {
          mediaItems.push(...toCreate);
          setStatus(`Added ${toCreate.length} media entr${toCreate.length === 1 ? 'y' : 'ies'} locally.`, 'ok');
        }

        mediaItems.sort((a,b) => a.sortOrder - b.sortOrder);
        renderList();
        resetForm();
      }

      function handleListClick(event) {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const item = mediaItems.find((m) => m.id === button.dataset.id);
        if (!item) return;

        if (button.dataset.action === 'delete') {
          mediaItems = mediaItems.filter((m) => m.id !== item.id);
          renderList();
          setStatus('Media entry removed locally.', 'ok');
          return;
        }

        mediaIdInput.value = item.id;
        titleInput.value = item.title;
        descriptionInput.value = item.description;
        typeInput.value = item.type;
        sortOrderInput.value = item.sortOrder;
        srcPathInput.value = item.src;
        submitButton.textContent = 'Update Media';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function downloadJson() {
        const data = JSON.stringify(buildJson(), null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'slideshow.json';
        a.click();
        URL.revokeObjectURL(url);
        setStatus('Downloaded updated slideshow.json. Replace the repo file with it.', 'ok');
      }

      fileInput.addEventListener('change', () => {
        const first = fileInput.files[0];
        if (!first) return;
        if (!typeInput.value) typeInput.value = detectType(first.name);
        srcPathInput.value = `assets/${first.name}`;
      });
      form.addEventListener('submit', handleSubmit);
      resetButton.addEventListener('click', resetForm);
      downloadButton.addEventListener('click', downloadJson);
      mediaList.addEventListener('click', handleListClick);

      loadFromRepo();
    </script>
  </body>
</html>
